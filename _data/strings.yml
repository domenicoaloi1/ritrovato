# Fixed texts of the page, one block per language.
# You only need to edit this file to add a language: copy the "en" block,
# change its key (e.g. "fr") and translate the values. Keep every line, and
# keep the placeholders in {braces} as they are: they are filled in automatically.
#   {title} -> the item's title        {id} -> the item's address, e.g. keys
#   {owner} -> owner_name from settings
# If a language key is "no" (Norwegian), write it in quotes: YAML 1.1
# reads a bare no as false.

en:
  heading_item: "You found: {title}"
  heading_generic: "You found something that belongs to me"
  belongs_to: "This belongs to {owner}."
  contact_heading: "How to reach me"
  reassurance: "This page will never ask you to log in, pay or install anything."
  not_configured: "This page is not fully set up yet."
  email_label: "Send an email"
  phone_label: "Call"
  whatsapp_label: "Message on WhatsApp"
  copy_hint: "If a button does not work, copy the address or number shown under it."
  email_subject_item: "Found: {title} ({id})"
  email_subject_generic: "I found something of yours"
  message_item: "Hi, I found your item “{title}” ({id})."
  message_generic: "Hi, I found something that belongs to you."
  # Added after the message in emails and WhatsApp, for the finder to fill in.
  # \n means a new line (only inside "double quotes").
  message_prompt: "Where I found it: \nWhere it is now: "
  form_heading: "Send a message"
  form_message_label: "Your message"
  form_message_hint: "Where did you find it, and where is it now?"
  form_reply_label: "Your email or phone, if you want a reply"
  form_submit: "Send"
  form_service_note: "Your message is delivered by an external service."

